name: Validate site content

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Python script syntax
        run: python -m py_compile scripts/*.py

      - name: Validate external link inventory
        run: python scripts/check_external_links.py --list

      - name: Validate JSON content
        run: python scripts/validate_content.py

      - name: Validate publication scope
        run: python scripts/validate_publication_scope.py

      - name: Verify sitemap is current
        run: python scripts/generate_sitemap.py --check

      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done

      - name: Install browser test dependencies
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Run browser smoke and visual-contract tests
        run: npm run test:smoke
